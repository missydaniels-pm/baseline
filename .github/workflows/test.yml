# Basic regression net (exit-gate punch-list item 5): run every test suite on
# every push and PR — once against SQLite, exactly as they run locally, and once
# against PostgreSQL 17 (the production major), since engine-split code paths
# (CHECK migrations, psycopg2 URLs, raw SQL) are otherwise first executed on
# staging (BACKLOG "Postgres in CI", 10/19/26). No Railway or Anthropic access,
# so no secrets are needed here. Python is pinned to match the Dockerfile.
name: tests

# Push covers the two deploy branches; pull_request covers feature branches —
# together every commit is tested once, not twice (a PR head push would
# otherwise fire both events for the same commit).
on:
  push:
    branches: [main, staging]
  pull_request:

# A rapid follow-up push cancels the now-stale run for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The GITHUB_TOKEN needs read-only access; state it here so the guarantee
# travels with the workflow rather than relying on the repo default.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Test harnesses POST via the Flask test client without CSRF tokens.
      # Never set this anywhere but test contexts (see CLAUDE.md).
      WTF_CSRF_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      # The lockfile must be internally consistent (catches a hand-edited pin).
      - run: pip check
      - name: Run all test suites
        run: |
          failed=""
          for t in test_*.py; do
            echo "=== $t ==="
            if timeout 120 python3 "$t"; then
              echo "PASS $t"
            else
              echo "FAIL $t"
              failed="$failed $t"
            fi
          done
          if [ -n "$failed" ]; then
            echo "Failed suites:$failed"
            exit 1
          fi

  tests-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Same major as production (EOL.md) — keep in step with backups/Dockerfile.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WTF_CSRF_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run all test suites against PostgreSQL (fresh database each)
        run: |
          failed=""
          i=0
          for t in test_*.py; do
            i=$((i+1))
            db="suite_$i"
            python3 -c "import psycopg2; c=psycopg2.connect('postgresql://postgres:ci@localhost:5432/postgres'); c.autocommit=True; c.cursor().execute('CREATE DATABASE $db')"
            echo "=== $t ($db) ==="
            if TEST_DATABASE_URL="postgresql://postgres:ci@localhost:5432/$db" timeout 180 python3 "$t"; then
              echo "PASS $t"
            else
              echo "FAIL $t"
              failed="$failed $t"
            fi
          done
          if [ -n "$failed" ]; then
            echo "Failed suites:$failed"
            exit 1
          fi
